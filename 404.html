<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 - 路西法小铺</title>
<meta name="robots" content="noindex">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
background:#050605;color:#f2f7f2;font-family:"Helvetica Neue",Helvetica,"PingFang SC",Tahoma,Arial,sans-serif;font-size:14px;
background-image:radial-gradient(900px 420px at 78% -8%,rgba(57,255,20,.12),transparent 62%)}
.box{width:100%;max-width:520px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(9,12,9,.9);
padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.code{font-size:44px;font-weight:800;color:#39ff14;text-shadow:0 0 18px rgba(57,255,20,.45);line-height:1}
h1{margin:10px 0 8px;font-size:1.3rem;font-weight:700}
p{margin:0 0 18px;color:#97a497;line-height:1.6}
a{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:10px;font-weight:700;color:#04140a;
text-decoration:none;background:linear-gradient(90deg,#39ff14,#b6ff3b)}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>页面不存在</h1>
  <p>你访问的商品或分类不存在，可能已经下架。</p>
  <a href="/">返回商店</a>
</div>
</body>
</html>
